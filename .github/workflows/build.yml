name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases for tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/carmadroid.exe, build/Release/SDL2.dll, README.md, LICENSE -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath carmadroid-x86-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: carmadroid-x86-windows-x64
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: carmadroid-x86-windows-x64.zip
          generate_release_notes: true
          body: |
            Windows build of carmadroid-x86: the Android version of Carmageddon (1.8.507) running natively on 64-bit Windows.

            **Game files are not included.** You need your own copies of:
            - the Carmageddon APK, version 1.8.507 (armeabi-v7a)
            - `main.507.com.stainlessgames.carmageddon.obb`

            Unzip, put the APK and OBB next to `carmadroid.exe`, and run it. See the README for controls and options.
